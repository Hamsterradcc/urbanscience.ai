name: Refresh network activity

# Reads the public data of the three sibling sites and rewrites data/activity.json, the digests, the feeds and the sitemap.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: network-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build network activity
        run: python scripts/build_network.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data feeds sitemap.xml)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data feeds sitemap.xml
          git commit -m "Refresh network activity"
          git pull --rebase
          git push
